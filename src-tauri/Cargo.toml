[package]
name = "multimouse"
version = "0.3.9"
description = "Share mouse and keyboard across devices"
authors = ["MultiMouse Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "multimouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Using fufesou's rdev fork: upstream 0.5.3 calls TSMGetInputSourceProperty
# from rdev's CGEventTap background thread on macOS, which trips Apple's
# _dispatch_assert_queue_fail — crashes the process on every incoming key
# event. This fork drops the string_from_code path (which we don't use —
# we only need the event_type, not the translated string) and exposes grab
# unconditionally (no feature flag needed).
rdev = { git = "https://github.com/fufesou/rdev", rev = "a90dbe11" }
enigo = "0.2"
mdns-sd = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1"
parking_lot = "0.12"
hostname = "0.4"
arboard = "3"
dirs = "5"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
tokio-tungstenite = "0.21"
futures-util = "0.3"
# Direct dep (already transitively in the tree via tokio/mio) so we can call
# `SockRef::set_tcp_keepalive` on the session TCP stream. Without OS-level
# keepalive, a peer's silent disconnect leaves the socket half-open for the
# kernel default (~2h on macOS/Linux) before either side notices. 30s idle
# + 5s interval + 3 probes detects dead sockets in ~45s.
socket2 = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
subtle = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication"] }
# v6 raw-mouse HID tap: CGEventTap at kCGHIDEventTap + CGAssociate(false) +
# CGEventGetIntegerValueField for MOUSE_EVENT_DELTA_X/Y. core-graphics 0.23 has
# the field constants we need; we drop events via raw FFI because the safe
# wrapper can't return NULL from the callback (see comments in raw_mouse_mac.rs).
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
# Phase 4: Windows Raw Input (WM_INPUT + RegisterRawInputDevices) for
# relative mouse deltas on the sender side. Also used by fullscreen_detect
# (SHQueryUserNotificationState) for auto-gaming-mode. Windows crate is the
# official MS-published FFI binding; features listed are the narrow surface
# we actually use so rustc doesn't build the whole Win32 universe.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    # Required for RegisterClassW + WNDCLASSW on windows-0.58 (WNDCLASSW
    # contains HICON/HCURSOR/HBRUSH fields that live in Graphics_Gdi).
    "Win32_Graphics_Gdi",
] }
