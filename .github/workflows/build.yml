name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Create the draft release ONCE before matrix jobs race to upload to it.
  # Using tauri-action to create the release caused ordering issues: later
  # runs could clobber it and matrix jobs raced on creation. This job runs
  # first, then matrix jobs just upload to the existing draft.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --draft -R "$REPO" \
              --title "MultiMouse $TAG" \
              --notes "$(cat <<'NOTES'
          ## Downloads

          | Platform | Installer |
          |---|---|
          | macOS (Apple Silicon M1/M2/M3) | `MultiMouse_*_aarch64.dmg` |
          | macOS (Intel) | `MultiMouse_*_x64.dmg` |
          | Windows 10/11 | `MultiMouse_*_x64-setup.exe` |
          | Linux | `MultiMouse_*_amd64.AppImage` |

          ## Setup
          - **macOS**: open the `.dmg`, drag to Applications, allow Accessibility.
          - **Windows**: run the `.exe` (SmartScreen: More info → Run anyway).
          - **Linux**: `chmod +x MultiMouse_*.AppImage && ./MultiMouse_*.AppImage`

          ## In-app auto-update
          Future releases will be pulled automatically by Settings → Check for update.
          NOTES
          )"
          else
            echo "Draft release $TAG already exists"
          fi

  build:
    needs: create-release
    # create-release only runs on tags; guard matrix so workflow_dispatch still
    # builds (with no release upload) without needing a release to exist first.
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the ARM runner. macos-13 (Intel)
          # runners have chronic capacity issues. Rust cross-compiles x86_64
          # from arm64 reliably.
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          pj=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -E '^version\s*=' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package.json=$pj  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if [ "$pj" != "$conf" ] || [ "$pj" != "$cargo" ]; then
            echo "::error::Versions must match across package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            relay-server

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxtst-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      # Build with the Tauri CLI directly (no tauri-action). tauri-action
      # aggressively cleans up `.nsis.zip` / `.AppImage.tar.gz` / `.sig` files
      # after it finishes uploading only a subset of artifacts, which broke
      # Windows/Linux auto-update. Calling `tauri build` ourselves keeps the
      # bundle dir intact.
      #
      # With `createUpdaterArtifacts: true` in tauri.conf.json, this produces
      # installers AND updater archives AND .sig files in one pass.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --target ${{ matrix.target }}

      - name: Build relay server
        run: cargo build --release --manifest-path relay-server/Cargo.toml

      # Inspect what the build produced — useful when a platform hides
      # updater archives in an unexpected subdirectory.
      - name: Show bundle tree
        shell: bash
        run: |
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 4 \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.app.tar.gz' -o -name '*.nsis.zip' \
               -o -name '*.AppImage.tar.gz' -o -name '*.sig' \) -print || true

      # Upload every relevant artifact to the draft release. macOS arm64 and
      # x64 both emit a file literally named MultiMouse.app.tar.gz[.sig], so
      # we rename with an arch suffix before upload to avoid overwriting.
      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          BUNDLE="src-tauri/target/$TARGET/release/bundle"

          arch_suffix=""
          case "$TARGET" in
            aarch64-apple-darwin) arch_suffix="aarch64" ;;
            x86_64-apple-darwin)  arch_suffix="x64" ;;
          esac

          upload() {
            local src="$1" name="$2"
            local tmp
            tmp=$(mktemp -d)
            cp "$src" "$tmp/$name"
            echo "Uploading: $name"
            gh release upload "$TAG" "$tmp/$name" --clobber -R "$GITHUB_REPOSITORY"
          }

          # Installers (names already unique).
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            upload "$f" "$(basename "$f")"
          done < <(find "$BUNDLE" -maxdepth 4 \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print)

          # macOS updater archive + sig — rename with arch suffix.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.app.tar.gz.sig) name="MultiMouse_${arch_suffix}.app.tar.gz.sig" ;;
              *.app.tar.gz)     name="MultiMouse_${arch_suffix}.app.tar.gz" ;;
              *) name="$(basename "$f")" ;;
            esac
            if [ -n "$arch_suffix" ]; then
              upload "$f" "$name"
            fi
          done < <(find "$BUNDLE" -maxdepth 4 -name '*.app.tar.gz*' -print)

          # Windows NSIS + Linux AppImage updater archives + sigs.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            upload "$f" "$(basename "$f")"
          done < <(find "$BUNDLE" -maxdepth 4 \
            \( -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \
               -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \) -print)

      # Keep workflow_dispatch artifact uploads so manual runs still produce
      # downloadable files even when there's no tag release to upload to.
      - name: Upload macOS DMG (artifact)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows installer (artifact)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-setup
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload Linux AppImage (artifact)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload relay binary (macOS arm64 only)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-macOS-arm64
          path: relay-server/target/release/relay

  # Aggregates per-platform updater signatures into latest.json so the
  # Tauri updater endpoint (releases/latest/download/latest.json) resolves.
  publish-updater-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Required to see draft releases; default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    steps:
      - name: Generate + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          VER="${TAG#v}"

          mkdir -p sigs
          RELEASE_ID=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for tag $TAG"
            exit 1
          fi
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' \
          | while read -r id name; do
              echo "Fetching $name"
              curl -sSL \
                -H "Accept: application/octet-stream" \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$id" \
                -o "sigs/$name"
            done
          echo "--- downloaded sigs ---"
          ls -la sigs/ || true

          read_sig() {
            local f
            for f in sigs/$1; do
              if [ -f "$f" ]; then cat "$f"; return; fi
            done
          }

          MAC_ARM=$(read_sig "*aarch64.app.tar.gz.sig")
          MAC_X64=$(read_sig "*x64.app.tar.gz.sig")
          WIN=$(read_sig "*x64-setup.nsis.zip.sig")
          LINUX=$(read_sig "*amd64.AppImage.tar.gz.sig")

          json_platforms="{"
          sep=""
          add() {
            local key="$1" sig="$2" url="$3"
            if [ -n "$sig" ]; then
              esc=$(printf '%s' "$sig" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip())[1:-1])')
              json_platforms+="$sep\"$key\":{\"signature\":\"$esc\",\"url\":\"$url\"}"
              sep=","
            fi
          }
          BASE="https://github.com/$REPO/releases/download/$TAG"
          add "darwin-aarch64" "$MAC_ARM"  "$BASE/MultiMouse_aarch64.app.tar.gz"
          add "darwin-x86_64"  "$MAC_X64"  "$BASE/MultiMouse_x64.app.tar.gz"
          add "windows-x86_64" "$WIN"      "$BASE/MultiMouse_${VER}_x64-setup.nsis.zip"
          add "linux-x86_64"   "$LINUX"    "$BASE/MultiMouse_${VER}_amd64.AppImage.tar.gz"
          json_platforms+="}"

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<JSON
          {
            "version": "$VER",
            "notes": "MultiMouse $TAG. See the release page for details.",
            "pub_date": "$PUB_DATE",
            "platforms": $json_platforms
          }
          JSON

          echo "--- latest.json ---"
          cat latest.json

          gh release upload "$TAG" latest.json --clobber -R "$REPO"
