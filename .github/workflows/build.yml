name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the ARM runner. macos-13 (Intel) runners
          # have chronic capacity issues and jobs often sit queued for hours.
          # Cross-compiling x86_64 from arm64 with Rust works reliably.
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          pj=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -E '^version\s*=' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package.json=$pj  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if [ "$pj" != "$conf" ] || [ "$pj" != "$cargo" ]; then
            echo "::error::Versions must match across package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            relay-server

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxtst-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      # On tag push: build + create GitHub release.
      # NOTE: Apple signing env vars are INTENTIONALLY omitted here — CLAUDE.md
      # documents that passing empty APPLE_CERTIFICATE values crashes
      # tauri-action's `security import` step. When Apple signing is eventually
      # configured, re-add APPLE_CERTIFICATE, _PASSWORD, _SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID here. Without those, tauri-
      # action produces an unsigned DMG (still works, Gatekeeper prompt on
      # first launch).
      - name: Build Tauri app (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MultiMouse ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            | Platform | Installer |
            |---|---|
            | macOS (Apple Silicon M1/M2/M3) | `MultiMouse_*_aarch64.dmg` |
            | macOS (Intel) | `MultiMouse_*_x64.dmg` |
            | Windows 10/11 | `MultiMouse_*_x64-setup.exe` |
            | Linux | `MultiMouse_*_amd64.AppImage` |

            ## Setup
            - **macOS**: Open the `.dmg`, drag MultiMouse to Applications. On first run go to System Settings → Privacy & Security → Accessibility and enable MultiMouse.
            - **Windows**: Run the `.exe` installer. Windows Defender SmartScreen may warn on first run — click "More info → Run anyway".
            - **Linux**: `chmod +x MultiMouse_*.AppImage && ./MultiMouse_*.AppImage`
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

      # On manual dispatch: just build, no release, no code signing
      - name: Build Tauri app (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      # tauri-action *deletes* the .sig files after its own latest.json
      # attempt fails (per-platform it only has one sig, so it skips).
      # Re-sign the updater archives with the same private key so the .sig
      # files exist again for the next upload step.
      - name: Re-sign updater archives
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          # Write the base64 key to a temp file. Tauri signer reads either a
          # path or raw value — path is safer on Windows (avoids arg mangling).
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/tauri.key"
          BUNDLE="src-tauri/target/$TARGET/release/bundle"
          # Use the tauri CLI we can pull on demand. This is the same key
          # handling as tauri-action's internal call.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Re-signing: $f"
            npx -y @tauri-apps/cli@^2 signer sign -k "$RUNNER_TEMP/tauri.key" "$f" || {
              echo "::warning::Failed to sign $f"
            }
          done < <(find "$BUNDLE" -maxdepth 4 \
            \( -name '*.app.tar.gz' -o -name '*.nsis.zip' -o -name '*.AppImage.tar.gz' \) \
            -not -name '*.sig' -print)
          rm -f "$RUNNER_TEMP/tauri.key"

      # Upload every updater archive + its .sig to the release. tauri-action
      # won't ship the sigs on its own (it wants to generate latest.json
      # itself, but fails because each platform job only has its own sig).
      # Naming: macOS .app.tar.gz[.sig] collides across arm64/x64, so we
      # rename with a target suffix. Other platforms' filenames already
      # embed the version + arch.
      - name: Upload updater assets to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          BUNDLE="src-tauri/target/$TARGET/release/bundle"
          echo "=== Listing bundle tree ==="
          find "$BUNDLE" -maxdepth 4 \( -name '*.sig' -o -name '*.app.tar.gz' -o -name '*.nsis.zip' -o -name '*.AppImage.tar.gz' \) -print

          arch_suffix=""
          case "$TARGET" in
            aarch64-apple-darwin) arch_suffix="aarch64" ;;
            x86_64-apple-darwin)  arch_suffix="x64" ;;
          esac

          upload() {
            local src="$1" name="$2"
            local tmp
            tmp=$(mktemp -d)
            cp "$src" "$tmp/$name"
            echo "Uploading: $name"
            gh release upload "$TAG" "$tmp/$name" --clobber -R "$GITHUB_REPOSITORY"
          }

          # macOS updater archive + sig (rename to include arch)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -n "$arch_suffix" ]; then
              upload "$f" "MultiMouse_${arch_suffix}.app.tar.gz"
            else
              upload "$f" "$(basename "$f")"
            fi
          done < <(find "$BUNDLE" -maxdepth 4 -name '*.app.tar.gz' -not -name '*.sig' -print)

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -n "$arch_suffix" ]; then
              upload "$f" "MultiMouse_${arch_suffix}.app.tar.gz.sig"
            else
              upload "$f" "$(basename "$f")"
            fi
          done < <(find "$BUNDLE" -maxdepth 4 -name '*.app.tar.gz.sig' -print)

          # Windows NSIS + Linux AppImage updater archives/sigs (already unique names)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            upload "$f" "$(basename "$f")"
          done < <(find "$BUNDLE" -maxdepth 4 \
            \( -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \
               -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \) -print)

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-setup
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMouse-${{ matrix.label }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Build relay server
        run: cargo build --release --manifest-path relay-server/Cargo.toml

      - name: Upload relay binary (macOS arm64 only)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-macOS-arm64
          path: relay-server/target/release/relay

  # Aggregates per-platform updater signatures into a single latest.json so
  # the Tauri updater endpoint (releases/latest/download/latest.json) actually
  # resolves. Each per-platform tauri-action tried and skipped this because
  # it only had its own platform's sig; we do it once, after `build`, with
  # all sigs already uploaded to the release by the platform jobs above.
  publish-updater-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Required to see and write to draft releases. Without this, the default
    # GITHUB_TOKEN has only read access and the API call for draft releases
    # returns an empty list ("release not found").
    permissions:
      contents: write
    steps:
      - name: Generate + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          VER="${TAG#v}"

          mkdir -p sigs
          # Pull every .sig from the release. Each platform job above has
          # already uploaded its own. Use the raw API to list assets (more
          # reliable than `gh release download --pattern` for draft releases)
          # and curl each .sig into place.
          RELEASE_ID=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for tag $TAG — aborting latest.json generation."
            exit 1
          fi
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' \
          | while read -r id name; do
              echo "Fetching asset $name ($id)"
              # Asset downloads need the `Accept: application/octet-stream` header.
              curl -sSL \
                -H "Accept: application/octet-stream" \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$id" \
                -o "sigs/$name"
            done
          echo "--- downloaded sigs ---"
          ls -la sigs/ || true

          read_sig() {
            # $1 = glob pattern. Print sig contents or empty if missing.
            local f
            for f in sigs/$1; do
              if [ -f "$f" ]; then cat "$f"; return; fi
            done
          }

          MAC_ARM=$(read_sig "*aarch64.app.tar.gz.sig")
          MAC_X64=$(read_sig "*x64.app.tar.gz.sig")
          WIN=$(read_sig "*x64-setup.nsis.zip.sig")
          LINUX=$(read_sig "*amd64.AppImage.tar.gz.sig")

          json_platforms="{"
          sep=""
          add() {
            local key="$1" sig="$2" url="$3"
            if [ -n "$sig" ]; then
              # Escape quotes + newlines in the signature for JSON.
              esc=$(printf '%s' "$sig" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip())[1:-1])')
              json_platforms+="$sep\"$key\":{\"signature\":\"$esc\",\"url\":\"$url\"}"
              sep=","
            fi
          }
          BASE="https://github.com/$REPO/releases/download/$TAG"
          add "darwin-aarch64" "$MAC_ARM"  "$BASE/MultiMouse_aarch64.app.tar.gz"
          add "darwin-x86_64"  "$MAC_X64"  "$BASE/MultiMouse_x64.app.tar.gz"
          add "windows-x86_64" "$WIN"      "$BASE/MultiMouse_${VER}_x64-setup.nsis.zip"
          add "linux-x86_64"   "$LINUX"    "$BASE/MultiMouse_${VER}_amd64.AppImage.tar.gz"
          json_platforms+="}"

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<JSON
          {
            "version": "$VER",
            "notes": "MultiMouse $TAG. See the release page for details.",
            "pub_date": "$PUB_DATE",
            "platforms": $json_platforms
          }
          JSON

          echo "--- latest.json ---"
          cat latest.json

          gh release upload "$TAG" latest.json --clobber -R "$REPO"
