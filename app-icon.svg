<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <linearGradient id="cursor-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="right-mon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Left monitor (dim — "this machine") -->
  <rect x="72" y="295" width="308" height="218" rx="18"
        fill="rgba(255,255,255,0.04)"
        stroke="rgba(255,255,255,0.22)" stroke-width="9"/>
  <!-- screen lines -->
  <rect x="104" y="326" width="160" height="7" rx="3.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="104" y="345" width="110" height="7" rx="3.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="104" y="364" width="135" height="7" rx="3.5" fill="rgba(255,255,255,0.07)"/>
  <!-- stand -->
  <rect x="210" y="513" width="42" height="30" rx="5" fill="rgba(255,255,255,0.07)"/>
  <rect x="162" y="540" width="138" height="8" rx="4" fill="rgba(255,255,255,0.07)"/>

  <!-- Right monitor (glowing — "other machine") -->
  <rect x="644" y="295" width="308" height="218" rx="18"
        fill="rgba(124,58,237,0.12)"
        stroke="url(#right-mon)" stroke-width="9"
        filter="url(#mon-glow)"/>
  <!-- screen lines -->
  <rect x="676" y="326" width="160" height="7" rx="3.5" fill="rgba(167,139,250,0.35)"/>
  <rect x="676" y="345" width="110" height="7" rx="3.5" fill="rgba(167,139,250,0.2)"/>
  <rect x="676" y="364" width="135" height="7" rx="3.5" fill="rgba(167,139,250,0.2)"/>
  <!-- stand -->
  <rect x="782" y="513" width="42" height="30" rx="5" fill="rgba(124,58,237,0.2)"/>
  <rect x="734" y="540" width="138" height="8" rx="4" fill="rgba(124,58,237,0.2)"/>

  <!-- Mouse cursor (centre, crossing between monitors) -->
  <!-- Standard arrow cursor pointing upper-left -->
  <path d="M 408,228
           L 408,574
           L 457,523
           L 500,638
           L 556,616
           L 514,500
           L 570,500
           Z"
        fill="url(#cursor-grad)"
        stroke="rgba(255,255,255,0.28)"
        stroke-width="10"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Subtle motion dots (→) showing direction -->
  <circle cx="592" cy="404" r="8" fill="rgba(167,139,250,0.5)"/>
  <circle cx="616" cy="404" r="8" fill="rgba(167,139,250,0.35)"/>
  <circle cx="640" cy="404" r="8" fill="rgba(167,139,250,0.18)"/>
</svg>
